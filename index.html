<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#000000">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Messages"
    >

    <title>Messages</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <main class="phone">

        <!-- TOP BAR -->

        <header class="header">

            <div class="back">
                ‹
            </div>

            <div class="contact">

                <div class="avatar"></div>

                <div class="contactInfo">

                    <div
                        class="name"
                        id="contactName"
                    >
                        Emma
                    </div>

                    <div
                        class="status"
                        id="contactStatus"
                    >
                        Active now
                    </div>

                </div>

            </div>

            <div class="info">
                ⓘ
            </div>

        </header>


        <!-- CHAT -->

        <section
            id="chat"
            class="chat"
        >
        </section>


        <!-- TYPING -->

        <div
            id="typing"
            class="typing hidden"
        >
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>


        <!-- MESSAGE INPUT -->

        <div class="inputBar">

            <input
                id="messageInput"
                type="text"
                placeholder="iMessage"
                autocomplete="off"
                autocorrect="on"
                spellcheck="true"
            >

            <button
                id="sendButton"
                type="button"
                aria-label="Send"
            >
                ↑
            </button>

        </div>

    </main>


    <!-- APP FILES -->

    <script src="config.js"></script>
    <script src="personality.js"></script>
    <script src="memory.js"></script>
    <script src="script.js"></script>

</body>
</html>
